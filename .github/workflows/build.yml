name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ created ]

jobs:
  geode:
    name: Build Geode CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: MacOS
          - os: windows-latest
            platform: Win64
          - os: ubuntu-latest
            platform: Android64
            android_abi: arm64-v8a
          - os: ubuntu-latest
            platform: Android32
            android_abi: armeabi-v7a
          - os: macos-latest
            platform: iOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ git ccache unzip wget

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install ninja cmake git ccache

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install ninja cmake git ccache -y

      - name: Install Android NDK
        if: matrix.platform == 'Android64' || matrix.platform == 'Android32'
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "$PWD/android-ndk-r26d" >> $GITHUB_PATH

      - name: Clone Geode SDK
        run: git clone --depth 1 https://github.com/geode-sdk/geode.git

      - name: Build Geode CLI (non-Windows)
        if: matrix.os != 'windows-latest'
        working-directory: geode
        env:
          GEODE_TARGET_PLATFORM: ${{ matrix.platform }}
          ANDROID_ABI: ${{ matrix.android_abi }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target geode

      - name: Build Geode CLI (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: geode
        env:
          GEODE_TARGET_PLATFORM: Win64
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGEODE_BUILD_BINDINGS=OFF
          cmake --build build --target geode

      - name: Package Geode CLI
        run: |
          mkdir -p geode-artifacts
          cp -r geode/build/bin geode-artifacts/
          zip -r geode-${{ matrix.platform }}.zip geode-artifacts

      - name: Upload Geode CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.platform }}
          path: geode-${{ matrix.platform }}.zip

  project:
    name: Build Project
    needs: geode
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: MacOS
          - os: windows-latest
            platform: Win64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ git ccache unzip

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install ninja cmake git ccache

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install ninja cmake git ccache -y

      - name: Download Geode CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: geode-${{ matrix.platform }}

      - name: Extract Geode CLI
        run: |
          unzip geode-${{ matrix.platform }}.zip
          echo "$PWD/geode-artifacts/bin" >> $GITHUB_PATH

      - name: Configure project
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build

      - name: Package project artifacts
        run: zip -r project-${{ matrix.platform }}.zip build/

      - name: Upload project artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-${{ matrix.platform }}
          path: project-${{ matrix.platform }}.zip

  release:
    name: Create Release
    needs: project
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download all project artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
