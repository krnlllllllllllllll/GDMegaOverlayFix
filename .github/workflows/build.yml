name: Build

on:
  push:
    branches: [ geode ]
  pull_request:
    branches: [ geode ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ gcc unzip curl git

      - name: Install Geode CLI
        run: |
          git clone --depth 1 https://github.com/geode-sdk/geode.git
          cd geode
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGEODE_BUILD_BINDINGS=OFF
          cmake --build build --target geode
          echo "$(pwd)/build/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package mod
        run: geode build --dir build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDMegaOverlayFix
          path: build/*.geode
