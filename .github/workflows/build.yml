name: Build

on:
  push:
    branches: [ geode ]
  pull_request:
    branches: [ geode ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ gcc unzip curl

      - name: Install Geode CLI
        run: |
          curl -Ls https://raw.githubusercontent.com/geode-sdk/geode/main/scripts/install.sh | bash
          echo "$HOME/.local/share/geode/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package mod
        run: geode build --dir build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDMegaOverlayFix
          path: build/*.geode
