name: Build

on:
  push:
    branches: [ geode ]
  pull_request:
    branches: [ geode ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ gcc

      - name: Install Geode SDK
        run: |
          curl -L https://github.com/geode-sdk/geode/releases/download/v5.7.1/geode-sdk-linux.zip -o geode.zip
          unzip geode.zip -d geode-sdk
          echo "GEODE_SDK=$(pwd)/geode-sdk" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DGEODE_SDK=$GEODE_SDK \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDMegaOverlayFix
          path: build/bin/*
