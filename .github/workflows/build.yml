name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # PLATFORM-SPECIFIC SETUP
      # -------------------------
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ git

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install ninja cmake git

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install ninja cmake git -y

      # -------------------------
      # BUILD GEODE CLI
      # -------------------------
      - name: Clone Geode SDK
        run: git clone --depth 1 https://github.com/geode-sdk/geode.git

      - name: Build Geode CLI
        working-directory: geode
        env:
          GEODE_TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_BUILD_BINDINGS=OFF \
            -DGEODE_TARGET_PLATFORM=${{ matrix.platform }}
          cmake --build build --target geode

      - name: Add Geode CLI to PATH
        run: echo "$(pwd)/geode/build/bin" >> $GITHUB_PATH

      # -------------------------
      # BUILD YOUR PROJECT
      # -------------------------
      - name: Build your project
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # -------------------------
      # OPTIONAL: UPLOAD ARTIFACTS
      # -------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: build/
